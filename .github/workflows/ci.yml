name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install flake8==7.4.1 bandit==1.9.4
      - run: flake8 qhardcharger --count --show-source --statistics
      - run: bandit -r qhardcharger --severity-level medium --exclude qhardcharger/embedded_external_libs
      - name: Check Python file permissions
        run: test -z "$(find qhardcharger -name '*.py' -perm -u+x)"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/unit -v
      - run: pip install -r requirements/testing.txt
      - run: python -m pytest tests/integration -v -m integration

  qgis4:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
      options: --user 0
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONOPTIMIZE: '0'
      PYTHONPATH: /tmp/qhardcharger-deps:/usr/share/qgis/python:/usr/lib/python3/dist-packages
    steps:
      - uses: actions/checkout@v7
      - name: Install isolated test dependencies
        run: python3 -m pip install --target /tmp/qhardcharger-deps -r requirements/testing.txt
      - name: Verify Qt 6 API compatibility
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile /tmp/qt6.log qhardcharger
          cat /tmp/qt6.log
          pyqt5_to_pyqt6.py qhardcharger
          git diff --exit-code -- qhardcharger
      - name: Test real QGIS 4 provider and dialog against Hardcharger
        run: python3 tests/qgis/verify_provider.py

  package:
    needs: [lint, test, qgis4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/package_plugin.py
      - uses: actions/upload-artifact@v7
        with:
          name: qhardcharger-plugin-zip
          path: dist/qhardcharger*.zip
          if-no-files-found: error

  package-offline:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          pip install --only-binary=:all: --target qhardcharger/embedded_external_libs -r qhardcharger/requirements.txt
      - run: python scripts/package_plugin.py --offline ${{ matrix.label }}
      - uses: actions/upload-artifact@v7
        with:
          name: qhardcharger-offline-${{ matrix.label }}-py312
          path: dist/*offline*.zip
          if-no-files-found: error

  release:
    needs: [package, package-offline]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release_notes.md
          test -s release_notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/qhardcharger*.zip
          name: qhardcharger ${{ github.ref_name }}
          body_path: release_notes.md
          fail_on_unmatched_files: true

  publish-plugin:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qhardcharger-plugin-zip
          path: dist
      - name: Upload stable package to QGIS repository
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${QGIS_PLUGIN_TOKEN:-}"
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${QGIS_PLUGIN_TOKEN}" \
            -F 'package=@dist/qhardcharger.zip' \
            'https://plugins.qgis.org/plugins/api/qhardcharger/version/add/')
          cat response.json
          test "$HTTP_CODE" = 201 -o "$HTTP_CODE" = 200
          python -c 'import json; data=json.load(open("response.json")); assert data.get("success") is True, data'
